[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codelens"
version = "0.1.0"
description = "AI-assisted code review CLI: fast static analysis, secret scanning and optional Claude review, with SARIF output for GitHub code scanning."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Thwaha" }]
keywords = ["code-review", "static-analysis", "security", "sarif", "cli", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["rich>=13.0"]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
codelens = "codelens.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codelens"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
