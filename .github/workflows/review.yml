name: codelens PR review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.base_ref }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install codelens
        run: python -m pip install ".[ai]"

      - name: Review changed files
        id: review
        run: |
          AI=""
          if [ -n "$ANTHROPIC_API_KEY" ]; then AI="--ai"; fi
          codelens review --diff "origin/$BASE_REF" $AI \
            --format markdown --output review.md --fail-on none
          codelens review --diff "origin/$BASE_REF" \
            --format sarif --output codelens.sarif --fail-on none

      - name: Comment on the PR
        continue-on-error: true # fork PRs get a read-only token
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file review.md

      - name: Upload to GitHub code scanning
        continue-on-error: true # needs code scanning enabled on the repo
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: codelens.sarif

      - name: Fail on critical findings
        run: codelens review --diff "origin/$BASE_REF" --fail-on critical --format json --output /dev/null
